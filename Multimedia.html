    <style>
      :root {
        --bg: #f4f2ea;
        --text: #1f3a2c;
        --muted: #6f8176;
        --line: #d8d8ca;
        --link: #1f4d36;
        --serif: "Instrument Serif", Georgia, "Times New Roman", serif;
      }
      *, *::before, *::after { box-sizing: border-box; }
      html { background: var(--bg); }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: var(--serif);
        font-size: 1.2rem;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
      }
      a {
        color: var(--link);
        text-decoration: underline;
        text-decoration-color: var(--line);
        text-underline-offset: 0.25em;
        transition: text-decoration-color 0.2s;
      }
      a:hover { text-decoration-color: var(--link); }
      a:focus-visible { outline: 2px solid var(--link); outline-offset: 4px; border-radius: 2px; }

      main {
        max-width: 68rem;
        margin: 0 auto;
        padding: clamp(2rem, 6vh, 4rem) 1.5rem 3rem;
      }
      .back { font-size: 1.05rem; }
      h1 {
        margin: 1.5rem 0 2.5rem;
        font-weight: 700;
        font-size: clamp(1.5rem, 4vw, 1.85rem);
        line-height: 1.25;
      }

      .collage { columns: 3; column-gap: 0.75rem; }
      .collage a { display: block; margin-bottom: 0.75rem; break-inside: avoid; }
      .collage img { display: block; width: 100%; height: auto; background: var(--line); border-radius: 2px; }

      .videos {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(18rem, 1fr));
        gap: 0.75rem;
        margin-top: 3rem;
        padding-top: 3rem;
        border-top: 1px solid var(--line);
      }
      .videos video { display: block; width: 100%; aspect-ratio: 16 / 9; background: #14261d; border-radius: 2px; }

      .site-footer {
        max-width: 68rem;
        margin: 0 auto;
        padding: 0 1.5rem 3rem;
        color: var(--muted);
        font-size: 0.95rem;
      }
      .site-footer p { margin: 0; }

      @media (max-width: 860px) { .collage { columns: 2; } }
      @media (max-width: 480px) { .collage { columns: 1; } }
    </style>
