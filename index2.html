<!doctype html>
<html lang="en">
  <head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-SC4V03VJMX"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-SC4V03VJMX');
    </script>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Welcome!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
    <style>
      :root {
        --green: #14261d;
        --paper: #f4f2ea;
        --serif: "Instrument Serif", Georgia, "Times New Roman", serif;
      }

      *, *::before, *::after { box-sizing: border-box; }

      html {
        height: 100%;
        background: var(--green);
      }

      /* No background on body: it would paint over the video behind it */
      body {
        height: 100%;
        margin: 0;
      }

      #fullscreenVideo {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: -2;
      }

      .overlay-text {
        min-height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1.5rem;
        color: var(--paper);
        text-align: center;
        font-family: var(--serif);
        font-weight: 400;
        font-size: clamp(1.75rem, 5vw, 2.75rem);
        line-height: 1.3;
        text-wrap: balance;
        text-shadow: 0 1px 18px rgba(0, 0, 0, 0.45);
      }

      .overlay-text a {
        color: var(--paper);
        text-decoration: underline;
        text-decoration-color: rgba(244, 242, 234, 0.45);
        text-underline-offset: 0.2em;
        transition: text-decoration-color 0.2s;
      }
      .overlay-text a:hover { text-decoration-color: var(--paper); }
      .overlay-text a:focus-visible {
        outline: 2px solid var(--paper);
        outline-offset: 6px;
        border-radius: 2px;
      }
    </style>
  </head>

  <body>
    <video id="fullscreenVideo" autoplay muted loop playsinline>
      <source src="Video/Website.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>

    <div class="overlay-text">
      <span>Hi! I'm Wyatt. Check out more about me
        <a href="index.html">here.</a>
      </span>
    </div>

    <script>
      // Respect reduced-motion settings: hold the first frame instead of looping.
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        var v = document.getElementById("fullscreenVideo"); v.removeAttribute("autoplay"); v.pause();
      }
    </script>
  </body>
</html>
